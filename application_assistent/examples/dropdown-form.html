<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropdown test form</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 560px; margin: 32px auto; }
  label { display: block; margin-top: 18px; font-weight: 600; }
  select, input, button.combo { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; text-align: left; }
  .combo-wrap { position: relative; }
  ul[role=listbox] { list-style: none; margin: 0; padding: 0; border: 1px solid #bbb; position: absolute; left: 0; right: 0; background: #fff; }
  ul[role=listbox][hidden] { display: none; }
  li[role=option] { padding: 8px 10px; cursor: pointer; } li[role=option]:hover { background: #eef; }
</style>
</head>
<body>
<h1>Dropdown test form (synthetic data only)</h1>
<form onsubmit="return false">
  <label for="gender">Gender <span style="color:#c00">*</span></label>
  <!-- no placeholder: browser pre-selects the first option -->
  <select id="gender" required><option>Male</option><option>Female</option><option>Other</option></select>

  <label for="state">State <span style="color:#c00">*</span></label>
  <select id="state" required><option value="">Select state</option><option>Chhattisgarh</option><option>Madhya Pradesh</option><option>Maharashtra</option></select>

  <label for="city">City (type or pick, datalist)</label>
  <input id="city" list="cities" placeholder="Start typing"><datalist id="cities"><option value="Bilaspur"><option value="Raipur"><option value="Durg"></datalist>

  <label id="course-label">Course (custom dropdown)</label>
  <div class="combo-wrap">
    <button type="button" class="combo" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="course-list" aria-labelledby="course-label" id="course">Choose a course</button>
    <ul role="listbox" id="course-list" hidden>
      <li role="option">B.Sc.</li><li role="option">B.Com.</li><li role="option">B.A.</li>
    </ul>
  </div>

  <label for="board">Board (readonly input combobox)</label>
  <input id="board" role="combobox" readonly aria-haspopup="listbox" aria-controls="board-list" placeholder="Select board">
  <ul role="listbox" id="board-list" hidden><li role="option">CGBSE</li><li role="option">CBSE</li></ul>
</form>
<script>
  function wire(trigger, list, setText) {
    trigger.addEventListener("click", () => { list.hidden = !list.hidden; trigger.setAttribute("aria-expanded", String(!list.hidden)); });
    list.addEventListener("click", e => { const o = e.target.closest("[role=option]"); if (!o) return; setText(o.textContent); list.hidden = true; });
  }
  wire(document.getElementById("course"), document.getElementById("course-list"), t => document.getElementById("course").textContent = t);
  wire(document.getElementById("board"), document.getElementById("board-list"), t => document.getElementById("board").value = t);
</script>
</body>
</html>
