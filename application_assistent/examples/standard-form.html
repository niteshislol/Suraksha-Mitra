<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Suraksha Mitra synthetic form fixture</title>
<style>body { max-width: 560px; margin: 2rem auto; font: 16px system-ui; } label { display:block; margin: 1rem 0; } </style>
<h1>Scholarship application</h1>
<form>
  <label for="name">Full name <input id="name" name="name" required></label>
  <label for="email">Email address <input id="email" name="email" type="email" required></label>
  <label for="dob">Date of birth <input id="dob" name="dob" type="date" required></label>
  <label for="pin">Postal PIN code <input id="pin" name="pin" inputmode="numeric"></label>
  <label for="document">Supporting document <input id="document" name="document" type="file"></label>
  <label><input type="checkbox" name="consent" required> I have reviewed my information</label>
  <button type="submit">Submit application</button>
</form>
